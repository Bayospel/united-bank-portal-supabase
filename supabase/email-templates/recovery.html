<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      background: #f8fafc;
      color: #0b1d3a;
      font-family: Arial, sans-serif;
      padding: 32px 16px;
    "
  >
    <main
      style="
        max-width: 560px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 32px;
      "
    >
      <p
        style="
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 3px;
          color: #c5a059;
          text-transform: uppercase;
        "
      >
        United Bank Offshore
      </p>
      <h1 style="font-size: 26px; margin: 18px 0 8px">Reset your United Bank password</h1>
      <p style="color: #536174; line-height: 1.6">
        We received a request to reset the password for your United Bank Offshore account. Use the button below to choose a new one.

      </p>
      <p style="margin: 28px 0">
        <a
          href="{{ .ConfirmationURL }}"
          style="
            display: inline-block;
            background: #0b1d3a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            padding: 13px 20px;
            font-weight: 700;
          "
          >Reset password</a
        >
      </p>
      <p style="font-size: 12px; color: #718096; line-height: 1.5">
        If you did not request this, you can safely ignore this email — your password will not change.
      </p>
    </main>
  </body>
</html>
